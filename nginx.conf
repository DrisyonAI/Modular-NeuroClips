# Nginx Reverse Proxy Configuration for mnc.mytestbed.tech
# Place in: /etc/nginx/sites-available/mnc.mytestbed.tech
# Upstream is the docker compose port (docker-compose.yml: 127.0.0.1:8130 -> 8000).
# Link: ln -s /etc/nginx/sites-available/mnc.mytestbed.tech /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name mnc.mytestbed.tech;

    client_max_body_size 250M;

    # Renders are served by the app (behind its session auth), not aliased from disk.

    # Realtime SSE Telemetry & Streaming Endpoint
    location /api/v1/telemetry/stream {
        proxy_pass http://127.0.0.1:8130/api/v1/telemetry/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # API & UI Proxy
    location / {
        proxy_pass http://127.0.0.1:8130;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }
}
