<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroClips Course Player</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <!-- Non-blocking Preview Mode Banner when LMS is not detected -->
  <div id="preview-mode-banner" class="preview-banner hidden">
    <span>⚠️ Preview Mode: No SCORM LMS connection detected. Progress is saved locally in your browser.</span>
  </div>

  <!-- App Header - Matches Screenshots 63-65 -->
  <header id="app-header" class="app-header">
    <div class="header-left">
      <span class="module-badge">Loading...</span>
    </div>
  </header>

  <!-- Main Learner Experience Container -->
  <main id="app" class="main-container">
    <div id="app-content">
      <div style="padding: 60px 20px; text-align: center; color: #64748B;">
        <div style="font-size: 28px; margin-bottom: 12px;">⏳</div>
        <p style="font-size: 14px; font-weight: 600;">Loading Course Experience...</p>
      </div>
    </div>
  </main>

  <!-- Modal Mount (e.g. Resume Dialog) -->
  <div id="app-modal" style="display: none;"></div>

  <!-- NeuroClips SCORM Runtime Scripts -->
  <script src="./js/scorm.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/components.js"></script>
  <script src="./js/quiz.js"></script>
  <script src="./js/player.js"></script>
</body>
</html>
