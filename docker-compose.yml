version: '3.8'

services:
  modular-neuroclips:
    build: .
    container_name: modular-neuroclips-app
    restart: unless-stopped
    ports:
      - "8130:8000"
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8000
      - DEVICE=cpu
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.1:8b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./render_output:/app/render_output
      - ./curriculum_output:/app/curriculum_output
      - ./exports:/app/exports
      - ./identities:/app/identities
      - ./assets_library:/app/assets_library
